# PipeWire echo cancellation for the handset (installed to ~/.config/pipewire/pipewire.conf.d/).
#
# The character's voice leaks from the earpiece into the mouthpiece. Without
# cancellation, Gemini would hear the character and treat it as the caller
# interrupting. The app plays into phone_aec_sink and records from
# phone_aec_source; the unit makes both the defaults.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = false
            capture.props = {
                node.name = "phone_aec_capture"
                node.passive = true
                target.object = "alsa_input.usb-C-Media_Electronics_Inc._USB_Audio_Device-00.mono-fallback"
            }
            source.props = {
                node.name = "phone_aec_source"
                node.description = "Phone mouthpiece (echo cancelled)"
            }
            sink.props = {
                node.name = "phone_aec_sink"
                node.description = "Phone earpiece"
            }
            playback.props = {
                node.name = "phone_aec_playback"
                node.passive = true
                target.object = "alsa_output.usb-C-Media_Electronics_Inc._USB_Audio_Device-00.analog-stereo"
            }
            aec.args = {
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                webrtc.gain_control = false
                webrtc.extended_filter = true
                webrtc.delay_agnostic = true
            }
        }
    }
]
